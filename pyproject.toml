[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dominant-circuit"
version = "0.2.0"
description = "Master decision-mechanics router: optimal stopping, multiattribute utility, MDP/POMDP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ariel Lee"}
]
keywords = [
    "optimal-stopping",
    "secretary-problem",
    "multiattribute-utility",
    "MDP",
    "POMDP",
    "decision-theory",
    "Bellman",
    "value-iteration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/ariel-lee-1023/dominant-circuit"
Repository = "https://github.com/ariel-lee-1023/dominant-circuit.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dominant_circuit" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=dominant_circuit --cov-fail-under=60"
